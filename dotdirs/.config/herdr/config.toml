onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+q"
split_vertical = "prefix+space"
split_horizontal = "prefix+enter"
next_agent = "prefix+a"
switch_workspace = "prefix+1..9"
switch_tab = "cmd+1..9"
next_tab = ["ctrl+tab", "prefix+right"]
previous_tab = ["ctrl+shift+tab", "prefix+left"]
next_workspace = ["shift+down", "prefix+down"]
previous_workspace = ["shift+up", "prefix+up"]

[ui]
accent = "cyan"
show_agent_labels_on_pane_borders = false
pane_gaps = false
agent_panel_sort = "priority"

[ui.toast]
delivery = "off"

[ui.sound]
enabled = false
