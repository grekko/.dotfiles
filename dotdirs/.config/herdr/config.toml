onboarding = false

[theme]
name = "terminal"
auto_switch = false

[keys]
prefix = "ctrl+q"
split_vertical = "prefix+space"
split_horizontal = "prefix+enter"
next_agent = "prefix+a"
switch_workspace = "prefix+1..9"
switch_tab = ""
next_tab = "prefix+right"
previous_tab = "prefix+left"
next_workspace = "prefix+down"
previous_workspace = "prefix+up"

[ui]
accent = "cyan"
show_agent_labels_on_pane_borders = false
pane_gaps = false
agent_panel_sort = "priority"

[ui.toast]
delivery = "off"

[ui.sound]
enabled = false
